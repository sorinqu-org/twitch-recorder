# Example secrets file for twitch_recorder.py, referenced from
# config.yaml via twitch.credentials_file.
#
# Keep real permissions on this file at 0600 - it holds a Twitch app secret.
#
# Only the "twitch" section (client_id, client_secret, oauth_token) is read
# by the service; any other keys are ignored. Earlier production copies of
# this file accumulated unrelated keys (channels, download_directory,
# check_interval, chunk_duration, gemini.model) left over from copy-pasting
# config.yaml - those do nothing here and are omitted from this example.
# See docs/CONFIGURATION.md for details.

twitch:
  # Client ID/secret of a Twitch application with the "client credentials"
  # grant enabled. Create one at https://dev.twitch.tv/console/apps.
  client_id: "your-twitch-client-id"
  client_secret: "your-twitch-client-secret"

  # Optional. Only needed if streamlink requires an authenticated request
  # (e.g. subscriber-only streams). A plain OAuth token, with or without the
  # "oauth:" prefix - both are accepted.
  oauth_token: ""
